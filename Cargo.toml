[package]
name = "subvault"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "SubVault T1 synthetic vault core: preserve original bytes, do not arrange them."

[[bin]]
name = "subvault"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
