[package]
name = "subvault"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "SubVault local-first preservation & static extraction core (Formats 1-6)."

[[bin]]
name = "subvault"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
html-escape = "=0.2.13"
miniz_oxide = "=0.8.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tl = "=0.7.8"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3
