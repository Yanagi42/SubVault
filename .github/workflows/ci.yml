name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-package:
    name: Rust Core, Web Demo & Release Bundle (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for format-compatibility worktrees)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 gcc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify deterministic synthetic T0 corpus
        run: python3 synthetic/generate_corpus.py --check

      - name: Prefetch locked crates for offline worktree compatibility tests
        run: cargo fetch --locked

      - name: Check formatting and Clippy lints (lib & binary)
        run: |
          cargo fmt --check
          cargo clippy --lib --bins --locked -- -D warnings

      - name: Build release binary
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: cargo build --locked --release

      - name: Run full Rust unit & integration test suite
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: cargo test --locked -- --test-threads=1

      - name: Run Web Demo unit & subpath asset checks
        run: |
          node --check app/app.js
          node scripts/test-web.mjs

      - name: Build portable release bundle & verify SHA256SUMS
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: |
          bash scripts/package-release.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)

  test-windows:
    name: Rust Core & Portable Bundle (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify deterministic synthetic T0 corpus
        run: python synthetic/generate_corpus.py --check

      - name: Check Clippy lints on Windows (lib & binary)
        run: cargo clippy --lib --bins --locked -- -D warnings

      - name: Check workbench frontend syntax
        run: node --check app/app.js

      - name: Run Windows native unit & integration test suites
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: cargo test --locked --lib --test windows_native --test format6_crypto --test redact --test real_bills --test workbench_e2e --test pdf_bill --test verify_package --test review_sheet --test review_snapshot -- --test-threads=1

      - name: Build portable Windows release bundle & verify SHA256SUMS
        shell: pwsh
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: |
          ./scripts/package-release-windows.ps1
          $line = (Get-Content dist/SHA256SUMS-windows.txt).Trim()
          $parts = $line -split '\s+'
          $actual = (Get-FileHash (Join-Path dist $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $parts[0]) { throw "SHA256 mismatch: $actual != $($parts[0])" }

      - name: Run Web Demo & Windows CLI-Web interop checks
        run: node scripts/test-web.mjs

  msrv-check:
    name: MSRV 1.88 Compile Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88 toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check library and binaries against Rust 1.88
        run: cargo check --lib --bins --locked
