[package]
name = "subvault"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "SubVault local-first preservation & static extraction core (Formats 1-5)."

[[bin]]
name = "subvault"
path = "src/main.rs"

[dependencies]
html-escape = "=0.2.13"
miniz_oxide = "=0.8.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tl = "=0.7.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
