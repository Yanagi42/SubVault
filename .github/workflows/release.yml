name: Release Portable Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-linux:
    name: Verify & Package Linux + Web Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 gcc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Linux pre-release verification gate
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: |
          python3 synthetic/generate_corpus.py --check
          cargo fetch --locked
          cargo fmt --check
          cargo clippy --lib --bins --locked -- -D warnings
          cargo test --locked -- --test-threads=1

      - name: Package Linux & Web portable archives
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          bash scripts/package-release.sh "$TAG_NAME"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          node scripts/test-web.mjs

      - name: Upload Linux & Web release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.zip
            dist/*.tar.gz

  build-windows:
    name: Verify & Package Windows x86_64 Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Windows pre-release verification gate
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
        run: |
          node --check app/app.js
          cargo clippy --lib --bins --locked -- -D warnings
          cargo test --locked --lib --test windows_native --test format6_crypto --test redact --test real_bills --test workbench_e2e --test pdf_bill --test verify_package --test review_sheet --test review_snapshot -- --test-threads=1

      - name: Package Windows portable archive
        shell: pwsh
        env:
          SUBVAULT_GIT_SHA: ${{ github.sha }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/package-release-windows.ps1 -TagName "$env:TAG_NAME"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip

  publish-release:
    name: Publish Combined GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Checkout repository (for RELEASE_NOTES.md)
        uses: actions/checkout@v4

      - name: Download Linux & Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - name: Create or update GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-assets/*.zip \
              release-assets/*.tar.gz \
              release-assets/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release-assets/*.zip \
              release-assets/*.tar.gz \
              release-assets/SHA256SUMS.txt \
              --title "SubVault $TAG_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
